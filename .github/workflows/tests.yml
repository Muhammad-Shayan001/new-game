name: tests
on: [push, pull_request]
jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Generated content is up to date
        run: |
          python3 tools/build_content.py
          git diff --exit-code
      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import || true
      - name: Run test suite
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --fixed-fps 60 --path . -s res://tests/run_tests.gd
