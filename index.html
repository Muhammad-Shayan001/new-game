<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERLIFE.EXE — Design Docs</title>
<style>
:root{--bg:#0b0d12;--fg:#e6e8ee;--mut:#8a90a2;--acc:#6ee7d8;--card:#141824}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--fg:#14161d;--mut:#5a6072;--acc:#0b7a70;--card:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
header{padding:28px 20px;border-bottom:1px solid #2a3040}
h1{margin:0;font-size:1.6rem;letter-spacing:.08em;color:var(--acc)}
header p{margin:4px 0 0;color:var(--mut)}
.wrap{display:flex;flex-wrap:wrap;max-width:1100px;margin:0 auto}
nav{flex:0 0 260px;padding:16px 20px}
nav a{display:block;padding:6px 0;color:var(--mut);text-decoration:none;cursor:pointer}
nav a:hover,nav a.on{color:var(--acc)}
main{flex:1 1 480px;min-width:0;padding:16px 20px 60px}
main pre,main table{overflow-x:auto;display:block;background:var(--card);padding:12px;border-radius:8px}
main table{border-collapse:collapse}
main td,main th{border:1px solid #2a3040;padding:4px 8px}
main code{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<header><h1>AFTERLIFE.EXE</h1><p>Godot 4 · Android first · design documents</p></header>
<div class="wrap"><nav id="nav"></nav><main id="doc">Loading…</main></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const docs=["PROJECT_OVERVIEW","GAME_DESIGN_DOCUMENT","GAMEPLAY_SYSTEMS","MISSION_DESIGN_TEMPLATE","PROGRESSION_DESIGN","GAMEPLAY_FLOWCHART","STORY_BIBLE","CHARACTER_BIBLE","CHAPTER_OUTLINES","DIALOGUE_SCRIPT","STORY_TIMELINE","ENDING_DESIGN","CINEMATIC_SCRIPT","WORLD_BIBLE","WORLD_MAP","LEVEL_DESIGN_DOCUMENT","LOCATION_REGISTER","ENVIRONMENT_ASSET_LIST","LEVEL_FLOW_DIAGRAMS","TECHNICAL_DESIGN_DOCUMENT","PROJECT_ARCHITECTURE","DATA_SCHEMA","CODING_STANDARDS","PROJECT_FOLDER_STRUCTURE","PLAYER_AND_INTERACTION_GUIDE","TESTING_AND_RUN_GUIDE","CONTENT_AUTHORING_GUIDE","ART_DIRECTION_GUIDE","UI_UX_GUIDE","AUDIO_DIRECTION_GUIDE","NETWORKING_DESIGN","ANDROID_PERFORMANCE_GUIDE","ASSET_REGISTER","TASK_TRACKER","BUG_TRACKER","CHANGELOG","BUILD_AND_TEST_GUIDE"];
mermaid.initialize({startOnLoad:false,theme:"dark"});
const nav=document.getElementById("nav"),main=document.getElementById("doc");
async function show(name){
  location.hash=name;
  [...nav.children].forEach(a=>a.classList.toggle("on",a.dataset.n===name));
  try{
    const r=await fetch("docs/"+name+".md");
    if(!r.ok) throw 0;
    main.innerHTML=marked.parse(await r.text());
    const blocks=main.querySelectorAll("code.language-mermaid");
    for(const [i,b] of [...blocks].entries()){
      const d=document.createElement("div");d.className="mermaid";
      try{const {svg}=await mermaid.render("m"+i+Date.now(),b.textContent);d.innerHTML=svg;}catch(e){d.textContent=b.textContent}
      b.parentElement.replaceWith(d);
    }
  }catch(e){main.textContent="Could not load "+name+".md";}
}
docs.forEach(n=>{const a=document.createElement("a");a.textContent=n.replace(/_/g," ").toLowerCase();a.dataset.n=n;a.onclick=()=>show(n);nav.appendChild(a)});
show(docs.includes(location.hash.slice(1))?location.hash.slice(1):"GAME_DESIGN_DOCUMENT");
</script>
</body>
</html>
